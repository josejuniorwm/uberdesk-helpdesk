<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UberDesk - Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Seu CSS centralizado -->
    <link rel="stylesheet" th:href="@{/css/uberdesk.css}">
</head>
<body>
<div class="top-accent"></div>

<div class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-3">
        <div>
            <div class="brand-kicker">UberDesk Help Desk</div>
            <h1 class="brand-title">Chamados</h1>
        </div>

        <a th:href="@{/ui/chamados/novo}" class="btn btn-uberdesk">
            + Novo Chamado
        </a>
    </div>
    <!-- BARRA DE FILTROS -->
    <div class="card card-uberdesk mb-4">
        <div class="card-body p-3">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="filtroBusca" class="form-label small text-secondary mb-1">Buscar por ID ou Título</label>
                    <input type="text" id="filtroBusca" class="form-control" placeholder="Ex: 12 ou impressora...">
                </div>

                <div class="col-md-3">
                    <label for="filtroStatus" class="form-label small text-secondary mb-1">Status</label>
                    <select id="filtroStatus" class="form-select">
                        <option value="ATIVOS" selected>Ativos (Aberto / Andamento)</option>
                        <option value="ABERTO">Aberto (A)</option>
                        <option value="ANDAMENTO">Em Andamento (E)</option>
                        <option value="ENCERRADO">Encerrados (F)</option>
                        <option value="TODOS">Todos</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label for="filtroPrioridade" class="form-label small text-secondary mb-1">Prioridade</label>
                    <select id="filtroPrioridade" class="form-select">
                        <option value="TODAS" selected>Todas</option>
                        <option value="ALTA">Alta (A)</option>
                        <option value="MEDIA">Média (M)</option>
                        <option value="BAIXA">Baixa (B)</option>
                    </select>
                </div>

                <div class="col-md-2 d-grid">
                    <button type="button" id="btnLimparFiltros" class="btn btn-outline-secondary">Limpar</button>
                </div>
            </div>
        </div>
    </div>
    <div class="card card-uberdesk">
        <div class="table-responsive">
            <table class="table table-hover table-striped table-uberdesk mb-0">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Status</th>
                    <th>Prioridade</th>
                    <th class="text-center">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="chamado : ${listaChamados}"
                    class="linha-chamado"
                    th:attr="data-id=${chamado.id},
                      data-titulo=${chamado.titulo},
                      data-status=${chamado.status != null ? chamado.status.name() : ''},
                      data-prioridade=${chamado.prioridade != null ? chamado.prioridade.name() : ''}">
                    <td class="fw-bold text-muted" th:text="'#' + ${chamado.id}">#1</td>
                    <td class="fw-semibold" th:text="${chamado.titulo}">Título de Teste</td>
                    <td>
                        <span th:if="${chamado.status != null}"
                              class="badge rounded-pill"
                              th:classappend="${chamado.status.name() == 'ABERTO'} ? 'status-aberto' : (${chamado.status.name() == 'ANDAMENTO'} ? 'status-andamento' : 'status-fechado')"
                              th:text="${chamado.status.name() == 'ABERTO'} ? 'A' : (${chamado.status.name() == 'ANDAMENTO'} ? 'E' : 'F')"
                              th:title="${chamado.status}">A</span>
                    </td>
                    <td>
                        <span th:if="${chamado.prioridade != null}"
                              class="badge rounded-pill"
                              th:classappend="${chamado.prioridade.name() == 'ALTA'} ? 'text-bg-danger' : (${chamado.prioridade.name() == 'MEDIA'} ? 'text-bg-warning' : 'prioridade-baixa')"
                              th:text="${chamado.prioridade.name() == 'ALTA'} ? 'A' : (${chamado.prioridade.name() == 'MEDIA'} ? 'M' : 'B')"
                              th:title="${chamado.prioridade}">A</span>
                    </td>
                    <td class="text-center">
                        <a th:href="@{/chamados/{id}/detalhes(id=${chamado.id})}" class="btn btn-sm btn-outline-info me-1">Interagir</a>
                        <a th:href="@{/ui/chamados/editar/{id}(id=${chamado.id})}" class="btn btn-sm btn-edit-ud me-1">Editar</a>
                        <a th:href="@{/ui/chamados/deletar/{id}(id=${chamado.id})}" class="btn btn-sm btn-delete-ud" onclick="return confirm('Tem certeza que deseja excluir este chamado?')">Excluir</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<!-- Script de filtros da tabela -->
<script th:src="@{/js/chamados-filtro.js}"></script>
</body>
</html>
