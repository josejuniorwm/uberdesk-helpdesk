<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Fragmento de barra superior reutilizável entre as páginas -->
<nav th:fragment="menu" class="navbar navbar-expand-lg border-bottom mb-4"
     style="background-color: var(--ud-surface); border-color: var(--ud-border) !important;">
    <div class="container">
        <!-- Marca principal do sistema -->
        <a class="navbar-brand fw-bold" th:href="@{/ui/chamados}">
            <span class="brand-title" style="font-size: 1.35rem;">UberDesk</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#uberdeskNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="uberdeskNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-2">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/ui/chamados}">Chamados</a>
                </li>
                <!-- Exibe o link de Usuários apenas para quem possui perfil ADMIN -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/ui/usuarios}">Usuários</a>
                </li>
            </ul>

            <!-- Informações do usuário autenticado e botão de sair -->
            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <span class="small text-secondary" sec:authentication="name">usuario@uberdesk.com</span>

                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-delete-ud">Sair</button>
                </form>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
