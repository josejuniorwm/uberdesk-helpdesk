<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UberDesk - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/uberdesk.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<div class="top-accent"></div>

<div class="container my-auto">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card-uberdesk p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="brand-kicker">HELPDESK SYSTEM</div>
                    <h1 class="brand-title">UberDesk</h1>
                </div>

                <!-- Alerta de erro (e-mail ou senha inválidos) -->
                <div th:if="${param.error}" class="alert alert-danger py-2 small text-center">
                    E-mail ou senha inválidos.
                </div>

                <!-- Alerta de logout -->
                <div th:if="${param.logout}" class="alert alert-success py-2 small text-center">
                    Você saiu do sistema com segurança.
                </div>

                <!-- O Spring Security espera exatamente action="/login", name="username" e name="password" -->
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">E-mail</label>
                        <input type="email" id="username" name="username" class="form-control"
                               placeholder="admin@uberdesk.com" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="••••••" required>
                    </div>

                    <button type="submit" class="btn btn-uberdesk w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
