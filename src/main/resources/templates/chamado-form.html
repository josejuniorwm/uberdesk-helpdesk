<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UberDesk - Chamados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Seu CSS centralizado -->
    <link rel="stylesheet" th:href="@{/css/uberdesk.css}">
</head>
<body>
<div class="top-accent"></div>

<div class="container py-5" style="max-width: 760px;">
    <div class="mb-4">
        <div class="brand-kicker">UberDesk Help Desk</div>
        <h1 class="brand-title" th:text="${chamado.id == null ? 'Novo Chamado' : 'Editar Chamado #' + chamado.id}">Novo Chamado</h1>    </div>

    <div class="card card-uberdesk p-4 p-md-5">
        <!-- th:object liga o formulário ao objeto ChamadoDTO que veio do Controller -->
        <form th:action="@{/ui/chamados/salvar}" th:object="${chamado}" method="post">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="titulo" class="form-label">Título do Chamado</label>
                <input type="text" id="titulo" th:field="*{titulo}" class="form-control" placeholder="Ex: Impressora não conecta na rede" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="prioridade" class="form-label">Prioridade</label>
                    <select id="prioridade" th:field="*{prioridade}" class="form-select" required>
                        <option value="0">Baixa</option>
                        <option value="1">Média</option>
                        <option value="2">Alta</option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select id="status" th:field="*{status}" class="form-select" required>
                        <option value="0">Aberto</option>
                        <option value="1">Em Andamento</option>
                        <option value="2">Encerrado</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="tecnico" class="form-label">Técnico Responsável</label>
                    <select id="tecnico" th:field="*{tecnico}" class="form-select" required>
                        <option value="" disabled selected>Selecione um técnico...</option>
                        <option th:each="user : ${usuarios}" th:value="${user.id}" th:text="${user.nome}"></option>
                    </select>
                </div>

                <div class="col-md-6 mb-3">
                    <label for="cliente" class="form-label">Cliente</label>
                    <select id="cliente" th:field="*{cliente}" class="form-select" required>
                        <option value="" disabled selected>Selecione um cliente...</option>
                        <option th:each="user : ${usuarios}" th:value="${user.id}" th:text="${user.nome}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-4">
                <label for="observacoes" class="form-label">Observações / Detalhes</label>
                <textarea id="observacoes" th:field="*{observacoes}" rows="4" class="form-control" placeholder="Descreva o problema com detalhes..." required></textarea>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <a th:href="@{/ui/chamados}" class="btn btn-outline-secondary px-4">Cancelar</a>
                <button type="submit" class="btn btn-uberdesk">Salvar Chamado</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
